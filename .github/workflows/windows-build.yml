name: Build Windows Executable
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt6 and WebEngine
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine qtwebchannel qtpositioning qtwebview'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Application
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\hive2browse.pro CONFIG+=release
          nmake

      - name: Package with DLLs
        shell: cmd
        run: |
          cd build\release
          windeployqt --release --no-translations hive2browse.exe

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: hive2browse-windows
          path: build/release/
